name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      server_url:
        description: 'Địa chỉ máy chủ Backend (Ví dụ: https://my-app.run.app)'
        required: false
        default: ''

jobs:
  build-apk:
    name: Build & Package APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Application
        env:
          VITE_API_URL: ${{ github.event.inputs.server_url || '' }}
        run: npm run build

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Configure Android SDK 36 and Licenses
        run: |
          chmod +x android/gradlew
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Copy Web Assets to Android
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          npx cap copy android || true

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuanLyRTG-Android-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-apk
          name: "Bản Cài Đặt Android APK - Quản Lý RTG"
          body: |
            ### 📱 Bản Cài Đặt Ứng Dụng Android (APK) - Tổ RTG Cảng HICT
            - **Tên tệp:** `app-debug.apk`
            - **Hệ điều hành hỗ trợ:** Android 7.0 trở lên
            - **Cập nhật:** Tự động biên dịch từ mã nguồn nhánh `main` mới nhất.

            #### 🛠️ Hướng dẫn cài đặt trên điện thoại:
            1. Bấm vào tệp **`app-debug.apk`** ở mục **Assets** bên dưới để tải về điện thoại.
            2. Mở tệp vừa tải và bấm **Cài đặt** (Install).
            3. Nếu điện thoại thông báo bảo mật "Tệp từ nguồn không xác định", chọn **Cho phép cài đặt từ nguồn này**.
            4. Khởi động ứng dụng **Quản Lý RTG** và đăng nhập.
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
