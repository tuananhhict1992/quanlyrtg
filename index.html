    <script>
      (function() {
        if (typeof AbortSignal !== 'undefined') {
          if (typeof AbortSignal.any !== 'function') {
            AbortSignal.any = function(signals) {
              var c = new AbortController();
              var list = Array.from(signals || []).filter(Boolean);
              for (var i = 0; i < list.length; i++) {
                if (list[i].aborted) {
                  c.abort(list[i].reason);
                  return c.signal;
                }
              }
              var onAbort = function() {
                c.abort(this.reason);
                for (var j = 0; j < list.length; j++) {
                  list[j].removeEventListener('abort', onAbort);
                }
              };
              for (var k = 0; k < list.length; k++) {
                list[k].addEventListener('abort', onAbort, { once: true });
              }
              return c.signal;
            };
          }
          if (typeof AbortSignal.timeout !== 'function') {
            AbortSignal.timeout = function(ms) {
              var c = new AbortController();
              var t = setTimeout(function() {
                var err = new Error('The operation was aborted due to timeout');
                err.name = 'TimeoutError';
                c.abort(err);
              }, ms);
              c.signal.addEventListener('abort', function() { clearTimeout(t); }, { once: true });
              return c.signal;
            };
          }
          if (typeof AbortSignal.prototype.throwIfAborted !== 'function') {
            AbortSignal.prototype.throwIfAborted = function() {
              if (this.aborted) {
                var err = this.reason || new Error('The operation was aborted');
                if (!err.name) err.name = 'AbortError';
                throw err;
              }
            };
          }
        }
        if (typeof window !== 'undefined') {
          if (!window.crypto) window.crypto = {};
          if (!window.crypto.randomUUID) {
            window.crypto.randomUUID = function() {
              if (window.crypto.getRandomValues) {
                return ('10000000-1000-4000-8000-100000000000').replace(/[018]/g, function(c) {
                  return (c ^ (window.crypto.getRandomValues(new Uint8Array(1))[0] & (15 >> (c / 4)))).toString(16);
                });
              }
              return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                var r = Math.random() * 16 | 0;
                var v = c === 'x' ? r : ((r & 0x3) | 0x8);
                return v.toString(16);
              });
            };
          }
        }
      })();
    </script>
